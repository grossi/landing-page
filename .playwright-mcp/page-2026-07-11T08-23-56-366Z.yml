      - paragraph [ref=f3e25]: 🚀 Publishing a NPM library
      - paragraph [ref=f3e26]: In this post I will explain how to bundle and publish a Typescript component library on NPM.
      - paragraph [ref=f3e27]: So I needed to create a component library for my work. Separating all the main components into a component library allows us to re-use it across projects and have better quality control.
      - paragraph [ref=f3e28]: I decided to write about what I found while learning how to create a component library and how to bundle and publish it to npm as a package.
      - paragraph [ref=f3e29]: Create-react-app
      - paragraph [ref=f3e30]: I decided to use create-react-app (with the typescript template) to speed up the process. Even if I'm not creating a SPA, having already Babel, Webpack, Jest and hot reloading is a big head start.
      - code [ref=f3e33]: cd /project-folder npx create-react-app . --template typescript
      - paragraph [ref=f3e34]: "We can then remove the files not related to those tools:"
      - code [ref=f3e37]: rm src/App.css src/App.test.tsx src/App.tsx src/logo.svg \ src/index.css src/index.tsx && rm -rf public/
      - paragraph [ref=f3e38]: Building the library
      - paragraph [ref=f3e39]: There are many available options to build the library into a usable state, but since we are using typescript the simplest one is just using the tsc compiler to build the folder we will export on npm as our package. Another popular choice is rollup, if you are publishing a package without typescript I recommend looking it up.
      - paragraph [ref=f3e40]: "If we set \"noEmit: false\" on the tsconfig.json tsc will output the compiled project into files. But if you just set noEmit to false on the tsconfig.json you will be greeted with this message the next time you run yarn tests:"
      - code [ref=f3e43]: "$ yarn test yarn run v1.22.5 $ react-scripts test --watchAll=false The following changes are being made to your tsconfig.json file: - compilerOptions.noEmit must be true"
      - paragraph [ref=f3e44]: ...and react-scripts will automatically change noEmit to true again. One way to get around this is to create a separate tsconfig for building the project.
      - paragraph [ref=f3e45]:
        - text: Create a
        - code [ref=f3e46]: tsconfig.build.json
        - text: "and on that file put noEmit as false:"
      - code [ref=f3e49]: "{ \"extends\": \"./tsconfig.json\", \"compilerOptions\": { \"outDir\": \"lib\", \"noEmit\": false }, \"exclude\": [ \"**/*.test.tsx\", \"**/*.stories.tsx\" ] }"
      - paragraph [ref=f3e50]: This extends the normal tsconfig, preferring the new values if the same attribute is declared.
      - paragraph [ref=f3e51]:
        - text: "So our build script on package.json becomes:"
        - code [ref=f3e52]: "\"build\": \"tsc --build tsconfig.build.json\""
      - paragraph [ref=f3e53]: Most of the configuration can stay on the tsconfig.json, which will just be extended.
      - paragraph [ref=f3e54]: "Here is the full tsconfig.json file:"
      - paragraph [ref=f3e55]: tsconfig.json
      - code [ref=f3e58]: "{ \"compilerOptions\": { \"baseUrl\": \"src\", \"target\": \"es5\", \"lib\": [ \"dom\", \"dom.iterable\", \"esnext\" ], \"allowJs\": false, \"allowSyntheticDefaultImports\": true, \"alwaysStrict\": true, \"declaration\": true, \"declarationMap\": true, \"esModuleInterop\": true, \"forceConsistentCasingInFileNames\": true, \"isolatedModules\": true, \"jsx\": \"react-jsx\", \"module\": \"esnext\", \"moduleResolution\": \"node\", \"noFallthroughCasesInSwitch\": true, \"noImplicitAny\": false, \"noImplicitReturns\": true, \"noImplicitThis\": true, \"noUnusedLocals\": true, \"noUnusedParameters\": true, \"resolveJsonModule\": true, \"sourceMap\": true, \"strict\": true, \"strictFunctionTypes\": true, \"strictNullChecks\": true, \"strictPropertyInitialization\": true, \"noEmit\": true }, \"include\": [ \"src/lib\" ] }"
      - paragraph [ref=f3e59]: "Here is some explanation of the most important configurations for a library:"
      - list [ref=f3e60]:
        - listitem [ref=f3e62]:
          - paragraph [ref=f3e63]:
            - paragraph [ref=f3e64]:
              - code [ref=f3e65]: declaration
              - text: creates .d.ts files with types for every file, essential for other typescript projects to be able to use the library.
        - listitem [ref=f3e67]:
          - paragraph [ref=f3e68]:
            - paragraph [ref=f3e69]:
              - code [ref=f3e70]: sourceMap
              - text: creates annotations for js files that tools like debuggers can use to better navigate the project
        - listitem [ref=f3e72]:
          - paragraph [ref=f3e73]:
            - paragraph [ref=f3e74]:
              - code [ref=f3e75]: declarationMap
              - text: creates annotations similar to sourceMap but for the .d.ts files
      - paragraph [ref=f3e76]:
        - text: The rest of the options are more related to what tsc considers an error and how it builds the code. You can learn more about each option on
        - link "https://www.typescriptlang.org/tsconfig" [ref=f3e77] [cursor=pointer]:
          - /url: https://www.typescriptlang.org/tsconfig
        - text: .
      - paragraph [ref=f3e78]:
        - text: With this running
        - code [ref=f3e79]: yarn build
        - text: will generate a /lib folder on the root of the project. That will be the folder we will be exposing as our npm package.
      - paragraph [ref=f3e80]: Publishing on npm
      - paragraph [ref=f3e81]: "Since we are compiling everything we want to publish into the /lib folder, we just need to add that as the directory on package.json and npm will ignore the rest (outside of the basic project files: package.json, README, CHANGELOG and LICENSE)"
      - paragraph [ref=f3e82]: We also need to specify the entry point to our package, in this case '/lib/index.js'.
      - paragraph [ref=f3e83]: package.json
      - code [ref=f3e86]: "... \"private\": false, \"main\": \"lib/index.js\", \"directories\": { \"lib\": \"lib\" }, \"files\": [ \"lib\" ]` ..."
      - paragraph [ref=f3e87]:
        - text: To see what files will be included you can run
        - code [ref=f3e88]: npx npm-packlist
        - text: ", it should only include the files inside /lib as well as the README and package.json"
      - paragraph [ref=f3e89]: "Now we just need to create an account on npm:"
      - paragraph [ref=f3e90]: "ps.: After running this command will you need to verify your email address to confirm your registration"
      - code [ref=f3e93]: npm adduser
      - paragraph [ref=f3e94]: "and publish our package:"
      - code [ref=f3e97]: npm publish
      - paragraph [ref=f3e98]: If you get an 403 error, check to see if a package with the same name doesn't already exist and make sure to verify your email address.
      - paragraph [ref=f3e99]:
        - text: And that's it! Now you can install your library anywhere using
        - code [ref=f3e100]: yarn add library-name
        - text: "!"
