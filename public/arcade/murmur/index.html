<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="/logo98.png">
<title>MURMUR</title>
<style>
  /* touch-action: the drag steers the ship; the browser must not claim it. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  .hud {
    position: fixed; inset: 0; pointer-events: none; color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    user-select: none; -webkit-user-select: none;
  }
  .score { position: absolute; top: 18px; left: 20px; font-size: 15px; letter-spacing: .18em; }
  .wake  { position: absolute; top: 42px; left: 20px; font-size: 12px; letter-spacing: .18em; opacity: .7; }
  .clock { position: absolute; top: 18px; right: 20px; font-size: 15px; letter-spacing: .18em; }
  .clock.low { animation: blink .5s steps(2) infinite; }
  .best  { position: absolute; top: 42px; right: 20px; font-size: 12px; letter-spacing: .18em; opacity: .5; }
  .banked {
    position: absolute; top: 96px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: .3em; opacity: 0;
  }
  .banked.announce { animation: announce 2.6s ease-out; }
  @keyframes announce { 0% { opacity: 0; } 10% { opacity: .95; } 70% { opacity: .95; } 100% { opacity: 0; } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .flash.hit { animation: hit .35s ease-out; }
  @keyframes hit { 0% { opacity: .55; } 100% { opacity: 0; } }
  /* Markers: on the target while it is on screen, on the border pointing at it when it is not. */
  .marker {
    position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap;
    font-size: 11px; letter-spacing: .12em; line-height: 1.25; text-shadow: 0 0 6px #000, 0 0 2px #000;
    opacity: .55;
  }
  .marker b { display: block; font-size: 20px; font-weight: 400; letter-spacing: 0; }
  /* The flock's distance hangs below its sign and the gate's sits above, so
     both can be read when the two point the same way. */
  #flockMark { margin-top: 9px; }
  #gateMark { margin-top: -9px; }
  .marker.edge { opacity: 1; }
  .reticle {
    position: absolute; left: 50%; top: 50%; width: 12px; height: 12px;
    transform: translate(-50%, -50%); border: 1px solid rgba(255,255,255,.3); border-radius: 50%;
  }
  /* The other thumb's button. Only a touch screen shows it. */
  .boost {
    position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,.55);
    display: none; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: .3em; text-indent: .3em; opacity: .8;
  }
  .boost.on { background: rgba(255,255,255,.22); opacity: 1; }
  .touch .boost { display: flex; }
  .touch .reticle { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .boost { display: flex; }
    .reticle { display: none; }
  }
  /* Once the run is over only the numbers stay: no markers, no reticle, no BOOST. */
  #flight.ended .marker, #flight.ended .boost, #flight.ended .reticle { display: none; }
  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 0 16px;
  }
  /* The title leaves the middle of the screen to the flock: words above it and below it. */
  .title-screen { justify-content: space-between; padding: 10vh 16px 12vh; }
  .title-screen > div { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  /* The end of a run darkens the middle so the result stays legible over the birds. */
  .result-screen { background: radial-gradient(ellipse 80% 40% at center, rgba(0,0,0,.94) 0%, rgba(0,0,0,.85) 55%, rgba(0,0,0,0) 100%); }
  .title { font-size: clamp(28px, 8vw, 54px); letter-spacing: .32em; margin-right: -.32em; font-weight: 700; }
  .sub   { font-size: clamp(11px, 3.1vw, 13px); letter-spacing: .16em; opacity: .6; line-height: 2; }
  .record { font-size: 13px; letter-spacing: .3em; }
  .blink { animation: blink 1.2s steps(2) infinite; font-size: 13px; letter-spacing: .3em; }
  @keyframes blink { 50% { opacity: 0; } }
  .hidden { display: none; }
  .for-touch { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .for-touch { display: inline; }
    .for-mouse { display: none; }
  }
</style>
<div class="hud" id="hud">
  <div class="flash" id="flash"></div>
  <div class="best" id="best"></div>
  <div class="hidden" id="flight">
    <div class="score" id="score"></div>
    <div class="wake" id="wake"></div>
    <div class="clock" id="clock"></div>
    <div class="banked" id="banked"></div>
    <div class="reticle"></div>
    <div class="marker" id="flockMark"><b>◇</b><span id="flockFar"></span></div>
    <div class="marker" id="gateMark"><span id="gateFar"></span><b>○</b></div>
    <div class="boost" id="boost">BOOST</div>
  </div>
  <div class="center title-screen" id="menu">
    <div>
      <div class="title">MURMUR</div>
      <div class="sub">DIVE THROUGH THE FLOCK TO GATHER IT<br>CARRY IT THROUGH THE GATE TO BANK IT<br>ROCKS WRECK YOU AND SCATTER YOUR WAKE</div>
    </div>
    <div>
      <div class="sub">
        <span class="for-mouse">MOUSE OR ARROWS STEER &middot; HOLD CLICK, W OR SPACE TO BOOST</span>
        <span class="for-touch">DRAG TO STEER<br>HOLD BOOST WITH THE OTHER THUMB</span>
      </div>
      <div class="blink">CLICK, TAP OR PRESS A KEY</div>
    </div>
  </div>
  <div class="center result-screen hidden" id="over">
    <div class="title" id="cause"></div>
    <div class="sub" id="result"></div>
    <div class="record hidden" id="record">NEW BEST</div>
    <div class="sub" id="facts"></div>
    <div class="blink">TAP OR PRESS A KEY TO RETRY</div>
  </div>
</div>
<script type="importmap">
  { "imports": { "three": "/arcade/vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
// Absolute paths: the page is also served without its trailing slash, where
// a relative import would resolve one folder too high.
import { createShipBody } from '/arcade/shared/ship.js';
import { mount } from '/arcade/murmur/main.js';

mount({ THREE, createShipBody });
</script>
