<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="/logo98.png">
<title>OPEN HORIZON</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  .hud {
    position: fixed; inset: 0; pointer-events: none; color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    user-select: none; -webkit-user-select: none;
  }
  .score { position: absolute; top: 18px; left: 20px; font-size: 15px; letter-spacing: .18em; }
  .gates { position: absolute; top: 18px; right: 20px; font-size: 15px; letter-spacing: .18em; }
  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 14px;
  }
  .title { font-size: clamp(28px, 6vw, 54px); letter-spacing: .32em; font-weight: 700; }
  .sub   { font-size: 13px; letter-spacing: .22em; opacity: .6; line-height: 2; }
  .blink { animation: blink 1.2s steps(2) infinite; font-size: 13px; letter-spacing: .3em; }
  @keyframes blink { 50% { opacity: 0; } }
  .hidden { display: none; }
</style>
<div class="hud">
  <div class="score" id="score"></div>
  <div class="gates" id="gates"></div>
  <div class="center" id="menu">
    <div class="title">OPEN HORIZON</div>
    <div class="sub">SKIM THE TERRAIN &middot; THREAD THE GATES<br>ARROWS / WASD OR MOUSE &middot; DON'T TOUCH THE GROUND</div>
    <div class="blink">PRESS ANY KEY TO START</div>
  </div>
  <div class="center hidden" id="over">
    <div class="title">DOWNED</div>
    <div class="sub" id="finalScore"></div>
    <div class="blink">PRESS ANY KEY TO RETRY</div>
  </div>
</div>
<script type="importmap">
  { "imports": { "three": "/arcade/vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createInput, startLoop, setText } from '../shared/runtime.js';

const DEMO = new URLSearchParams(location.search).has('demo');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 120, 380);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ---- value noise terrain ----
const hash = (x, z) => {
  let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
};
const smooth = t => t * t * (3 - 2 * t);
function noise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = smooth(x - ix), fz = smooth(z - iz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}
const CELL = 26;
function terrainH(wx, wz) {
  let h = noise(wx / CELL, wz / CELL) * 13 + noise(wx / (CELL * 2.7) + 40, wz / (CELL * 2.7)) * 9;
  return h - 6;
}

const W = 340, D = 460, SX = 52, SZ = 64;
const terrGeo = new THREE.PlaneGeometry(W, D, SX, SZ);
terrGeo.rotateX(-Math.PI / 2);
// Every possible height lies in [-6, 16], including rows not sampled yet.
terrGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), Math.hypot(W / 2, D / 2, 16));
const terrain = new THREE.Mesh(terrGeo, new THREE.MeshBasicMaterial({
  color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3
}));
terrain.position.z = -D / 2 + 60;
scene.add(terrain);
const tPos = terrGeo.attributes.position;

let travel = 0;
const ROW_STEP = D / SZ, TERRAIN_Z = -D / 2 + 60, ROW_VERTS = SX + 1;
let terrainRow = NaN;
function updateTerrain() {
  const row = Math.floor(travel / ROW_STEP);
  const snapped = row * ROW_STEP;
  // Translate continuously; sample only newly exposed world-space rows.
  terrain.position.z = TERRAIN_Z + travel - snapped;
  if (row === terrainRow) return;
  const advance = row - terrainRow;
  let rowsToBuild = SZ + 1;
  if (advance > 0 && advance <= SZ) {
    for (let z = SZ; z >= advance; z--) {
      for (let x = 0; x < ROW_VERTS; x++) {
        tPos.setY(z * ROW_VERTS + x, tPos.getY((z - advance) * ROW_VERTS + x));
      }
    }
    rowsToBuild = advance;
  }
  for (let i = 0; i < rowsToBuild * ROW_VERTS; i++) {
    tPos.setY(i, terrainH(tPos.getX(i), tPos.getZ(i) + TERRAIN_Z - snapped));
  }
  terrainRow = row;
  tPos.needsUpdate = true;
}

// stars
{
  const n = 300, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = 380 + Math.random() * 80;
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = 20 + Math.random() * 220;
    pos[i * 3 + 2] = Math.sin(a) * r - 100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, transparent: true, opacity: 0.5, fog: false })));
}

// ship
const ship = new THREE.Group();
const shipGeo = new THREE.ConeGeometry(0.9, 3, 4);
shipGeo.rotateX(-Math.PI / 2);
ship.add(new THREE.Mesh(shipGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true })));
const wingGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(-2.4, 0, 1.2), new THREE.Vector3(0, 0, -1), new THREE.Vector3(2.4, 0, 1.2), new THREE.Vector3(-2.4, 0, 1.2)
]);
ship.add(new THREE.Line(wingGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));
scene.add(ship);

// gates
const gates = [];
const gateGeo = new THREE.TorusGeometry(6.5, 0.28, 6, 28);
const gateMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const gateMatHit = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 });
function spawnGate(z) {
  const x = (Math.random() * 2 - 1) * 55;
  const g = new THREE.Mesh(gateGeo, gateMat);
  g.position.set(x, 0, z);
  g.userData = { passed: false, x };
  gates.push(g); scene.add(g);
}

const scoreEl = document.getElementById('score'), gatesEl = document.getElementById('gates'),
      menuEl = document.getElementById('menu'), overEl = document.getElementById('over'),
      finalEl = document.getElementById('finalScore');

let state = 'menu', px = 0, py = 12, vx = 0, vy = 0, speed = 0, gateCount = 0, lockUntil = 0;

function reset() {
  for (const g of gates) scene.remove(g);
  gates.length = 0;
  travel = 0; px = 0; vx = vy = 0; speed = 45; gateCount = 0;
  py = terrainH(0, 0) + 14;
  for (let i = 1; i <= 4; i++) spawnGate(-90 * i - 60);
  state = 'play';
  menuEl.classList.add('hidden'); overEl.classList.add('hidden');
}
function gameOver() {
  state = 'over';
  setText(finalEl, 'GATES ' + gateCount + ' · DIST ' + Math.floor(travel));
  overEl.classList.remove('hidden');
  lockUntil = performance.now() + 600;
}

const input = createInput({ onPress: press });
const { keys, pointer } = input;

function press() {
  if (performance.now() < lockUntil) return;
  if (state !== 'play') reset();
}

let keyboardBias = 0;
let hudElapsed = 0.1;
function tick(dt) {
  hudElapsed += dt;
  const refreshHud = hudElapsed >= 0.1;
  if (refreshHud) hudElapsed = 0;

  if (state === 'play') {
    // input: keyboard wins while held; else mouse position steers
    let ax = (keys.ArrowLeft || keys.KeyA ? -1 : 0) + (keys.ArrowRight || keys.KeyD ? 1 : 0);
    let ay = (keys.ArrowUp || keys.KeyW ? 1 : 0) + (keys.ArrowDown || keys.KeyS ? -1 : 0);
    const usingKeys = ax !== 0 || ay !== 0;
    if (usingKeys) keyboardBias = 1.2;
    keyboardBias = Math.max(0, keyboardBias - dt);

    let tx = px, ty = py;
    if (DEMO) {
      const next = gates.find(g => !g.userData.passed && g.userData.hSet);
      if (next) { tx = next.position.x; ty = next.position.y; }
      // never fly into the ground: clear the terrain ahead
      let maxG = -99;
      for (let dz = 5; dz <= 60; dz += 11)
        maxG = Math.max(maxG, terrainH(px, -travel - dz), terrainH(tx, -travel - dz));
      ty = Math.max(ty, maxG + 5);
      vx += (Math.max(-1, Math.min(1, (tx - px) / 14)) * 95 - vx * 4) * dt;
      vy += (Math.max(-1, Math.min(1, (ty - py) / 7)) * 95 - vy * 4.5) * dt;
    } else if (usingKeys || !input.pointerActive || keyboardBias > 0) {
      vx += (ax * 95 - vx * 4) * dt;
      vy += (ay * 75 - vy * 4) * dt;
    } else {
      vx += (pointer.x * 110 - vx * 4.5) * dt;
      vy += (-pointer.y * 85 - vy * 4.5) * dt;
    }
    px = Math.max(-70, Math.min(70, px + vx * dt));
    py = Math.max(1, Math.min(55, py + vy * dt));

    speed = Math.min(115, speed + dt * 2);
    travel += speed * dt;
    refreshHud && setText(scoreEl, 'DIST ' + Math.floor(travel));
    setText(gatesEl, 'GATES ' + gateCount);

    // terrain collision
    const ground = terrainH(px, -travel);
    if (py < ground + 1.1) return gameOver();

    // gates
    for (let i = gates.length - 1; i >= 0; i--) {
      const g = gates[i];
      g.position.z += speed * dt;
      g.rotation.z += dt * 0.6;
      if (!g.userData.passed && g.position.z > -3 && g.position.z < 3) {
        const dx = px - g.position.x, dy = py - g.position.y;
        if (Math.hypot(dx, dy) < 5.6) {
          g.userData.passed = true;
          g.material = gateMatHit;
          gateCount++;
        }
      }
      if (g.position.z > 30) {
        scene.remove(g); gates.splice(i, 1);
        spawnGate(-360 - Math.random() * 60);
      }
    }
    // keep gates above terrain as they approach (heights fixed at spawn otherwise)
    for (const g of gates) {
      if (!g.userData.hSet && g.position.z > -350) {
        const h = terrainH(g.userData.x, g.position.z - travel);
        g.position.y = h + 9 + Math.random() * 14;
        g.userData.hSet = true;
      }
    }
    updateTerrain();
  }

  ship.position.set(px, py, 0);
  ship.rotation.z = -vx * 0.012;
  ship.rotation.x = vy * 0.006;
  camera.position.x += (px * 0.85 - camera.position.x) * Math.min(1, dt * 4);
  camera.position.y += ((py + 5.5) - camera.position.y) * Math.min(1, dt * 4);
  camera.position.z = 16;
  camera.lookAt(px, py + 0.5, -30);
  renderer.render(scene, camera);
}
updateTerrain();
startLoop(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
if (DEMO) setTimeout(reset, 400);
</script>
