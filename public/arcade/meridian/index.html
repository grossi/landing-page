<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="/logo98.png">
<title>MERIDIAN</title>
<style>
  /* touch-action: the drag steers the ship; the browser must not claim it. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  .hud {
    position: fixed; inset: 0; pointer-events: none; color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    user-select: none; -webkit-user-select: none;
  }
  .score { position: absolute; top: 18px; left: 20px; font-size: 15px; letter-spacing: .18em; }
  .chain { position: absolute; top: 42px; left: 20px; font-size: 12px; letter-spacing: .18em; opacity: .7; white-space: pre; }
  .low {
    position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .3em; margin-right: -.3em;
  }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .flash.hit { animation: hit .35s ease-out; }
  @keyframes hit { 0% { opacity: .55; } 100% { opacity: 0; } }
  .best  { position: absolute; top: 18px; right: 20px; font-size: 15px; letter-spacing: .18em; opacity: .5; }
  .dial  { position: absolute; top: 42px; right: 20px; font-size: 11px; letter-spacing: .18em; opacity: .5; }
  .sector {
    position: absolute; top: 96px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: .5em; opacity: 0;
  }
  .sector.announce { animation: announce 3.2s ease-out; }
  @keyframes announce { 0% { opacity: 0; } 12% { opacity: .9; } 70% { opacity: .9; } 100% { opacity: 0; } }
  .charge {
    position: absolute; bottom: 26px; left: 50%; width: min(260px, 60vw); transform: translateX(-50%);
    font-size: 11px; letter-spacing: .3em; text-align: center;
  }
  .charge .bar { height: 8px; border: 1px solid rgba(255,255,255,.55); margin-bottom: 8px; }
  .charge .fill { height: 100%; width: 100%; background: #fff; }
  .charge .label { opacity: .5; }
  .charge.low { animation: blink .5s steps(2) infinite; }
  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 0 16px;
  }
  .title { font-size: clamp(28px, 8vw, 54px); letter-spacing: .32em; margin-right: -.32em; font-weight: 700; }
  .sub   { font-size: clamp(11px, 3.1vw, 13px); letter-spacing: .22em; opacity: .6; line-height: 2; }
  .record { font-size: 13px; letter-spacing: .3em; }
  .blink { animation: blink 1.2s steps(2) infinite; font-size: 13px; letter-spacing: .3em; }
  @keyframes blink { 50% { opacity: 0; } }
  .hidden { display: none; }
</style>
<div class="hud">
  <div class="flash" id="flash"></div>
  <div class="best" id="best"></div>
  <div class="dial hidden" id="dial"></div>
  <div class="hidden" id="flight">
    <div class="score" id="score"></div>
    <div class="low" id="low"></div>
    <div class="chain" id="chain"></div>
    <div class="sector" id="sector"></div>
    <div class="charge" id="charge">
      <div class="bar"><div class="fill" id="chargeFill"></div></div>
      <div class="label">CHARGE</div>
    </div>
  </div>
  <div class="center" id="menu">
    <div class="title">MERIDIAN</div>
    <div class="sub">FLY LOW FOR ×3<br>THREAD THE GATES TO STAY CHARGED<br>DON'T HIT ANYTHING</div>
    <div class="sub">MOUSE OR ARROWS &middot; DRAG ON A PHONE</div>
    <div class="blink">CLICK, TAP OR PRESS A KEY</div>
  </div>
  <div class="center hidden" id="over">
    <div class="title" id="cause"></div>
    <div class="sub" id="result"></div>
    <div class="record hidden" id="record">NEW BEST</div>
    <div class="sub" id="facts"></div>
    <div class="blink">TAP OR PRESS A KEY TO RETRY</div>
  </div>
</div>
<script type="importmap">
  { "imports": { "three": "/arcade/vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
// Absolute paths: the page is also served without its trailing slash, where
// a relative import would resolve one folder too high.
import { createShipBody } from '/arcade/shared/ship.js';
import { mount } from '/arcade/meridian/main.js';

mount({ THREE, createShipBody });
</script>
