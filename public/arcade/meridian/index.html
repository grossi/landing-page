<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link rel="icon" href="/logo98.png">
<title>MERIDIAN</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  .hud {
    position: fixed; inset: 0; pointer-events: none; color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    user-select: none; -webkit-user-select: none;
  }
  .biome { position: absolute; top: 18px; left: 20px; font-size: 15px; letter-spacing: .18em; transition: opacity .8s; }
  .dist  { position: absolute; top: 42px; left: 20px; font-size: 12px; letter-spacing: .18em; opacity: .5; }
  .title-line {
    position: absolute; top: 26px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: .5em; opacity: .8;
  }
  .hint  {
    position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: .28em; opacity: .45;
  }
</style>
<div class="hud">
  <div class="title-line">MERIDIAN</div>
  <div class="biome" id="biome"></div>
  <div class="dist" id="dist"></div>
  <div class="hint">MOUSE STEERS &middot; THE LAND KEEPS CHANGING &middot; YOU CANNOT CRASH</div>
</div>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const DEMO = new URLSearchParams(location.search).has('demo');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 100, 255);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 900);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ---- noise ----
const hash = (x, z) => {
  let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
};
const smooth = t => t * t * (3 - 2 * t);
function noise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = smooth(x - ix), fz = smooth(z - iz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
}

// ---- biomes: cycle by distance travelled ----
const BIOMES = [
  { name: 'THE RANGES',   f: (x, z, t) => noise(x / 34, z / 34) * 26 + noise(x / 90 + 40, z / 90) * 18 - 14 },
  { name: 'THE DUNES',    f: (x, z, t) => Math.abs(noise(x / 60, z / 46) - 0.5) * -44 + 12 + noise(x / 18, z / 18) * 2 },
  { name: 'THE SEA',      f: (x, z, t) => Math.sin(x / 21 + t * 1.1) * 2.2 + Math.sin(z / 16 + t * 0.8) * 2.6 + noise(x / 50, z / 50) * 3 - 5 },
  { name: 'THE SHARDS',   f: (x, z, t) => { const n = noise(x / 26, z / 26); return (n > 0.62 ? (n - 0.62) * 120 : n * 6) - 6; } },
  { name: 'THE FLATS',    f: (x, z, t) => noise(x / 70, z / 70) * 5 - 4 }
];
const BIOME_SPAN = 900; // distance per biome

// terrain grid that follows the ship
const GW = 64, GD = 64, CELL = 9;
const terrGeo = new THREE.PlaneGeometry(GW * CELL, GD * CELL, GW, GD);
terrGeo.rotateX(-Math.PI / 2);
const terrain = new THREE.Mesh(terrGeo, new THREE.MeshBasicMaterial({
  color: 0xffffff, wireframe: true, transparent: true, opacity: 0.32
}));
terrain.frustumCulled = false;
scene.add(terrain);
const tPos = terrGeo.attributes.position;

function heightAt(wx, wz, dist, t) {
  const seg = dist / BIOME_SPAN;
  const i = Math.floor(seg) % BIOMES.length, j = (i + 1) % BIOMES.length;
  const u = seg - Math.floor(seg);
  const f = u > 0.8 ? smooth((u - 0.8) / 0.2) : 0; // crossfade in the last fifth
  const a = BIOMES[i].f(wx, wz, t);
  return f === 0 ? a : a * (1 - f) + BIOMES[j].f(wx, wz, t) * f;
}

// stars + horizon sun
{
  const n = 350, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = 500 + Math.random() * 200;
    pos[i * 3] = Math.cos(a) * r;
    pos[i * 3 + 1] = 30 + Math.random() * 320;
    pos[i * 3 + 2] = Math.sin(a) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, transparent: true, opacity: 0.5, fog: false })));
}
const sunDisk = new THREE.Group();
{
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, fog: false });
  for (const r of [26, 22]) {
    const pts = [];
    for (let a = 0; a <= 64; a++) pts.push(new THREE.Vector3(Math.cos(a / 64 * Math.PI * 2) * r, Math.sin(a / 64 * Math.PI * 2) * r, 0));
    sunDisk.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
  }
  // horizontal scanlines through the disk (retro sun)
  for (let i = 0; i < 5; i++) {
    const y = -4 - i * 4, half = Math.sqrt(Math.max(0, 26 * 26 - y * y));
    sunDisk.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-half, y, 0), new THREE.Vector3(half, y, 0)]), mat));
  }
  scene.add(sunDisk);
}

// ship
const ship = new THREE.Group();
const shipGeo = new THREE.ConeGeometry(0.9, 3, 4);
shipGeo.rotateX(-Math.PI / 2);
ship.add(new THREE.Mesh(shipGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true })));
const wingGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(-2.4, 0, 1.2), new THREE.Vector3(0, 0, -1), new THREE.Vector3(2.4, 0, 1.2), new THREE.Vector3(-2.4, 0, 1.2)
]);
ship.add(new THREE.Line(wingGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));
scene.add(ship);

const biomeEl = document.getElementById('biome'), distEl = document.getElementById('dist');

let pointer = { x: 0, y: 0 };
addEventListener('pointermove', e => { pointer = { x: e.clientX / innerWidth * 2 - 1, y: e.clientY / innerHeight * 2 - 1 }; });
addEventListener('touchmove', e => {
  pointer = { x: e.touches[0].clientX / innerWidth * 2 - 1, y: e.touches[0].clientY / innerHeight * 2 - 1 };
}, { passive: true });
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });

let wx = 0, wz = 0, heading = 0, dist = 0, shipY = 10, t = 0, lastBiome = '';

let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
  last = now;
  t += dt;

  // steer: mouse x = turn, keys work too
  let turn = pointer.x;
  if (keys.ArrowLeft || keys.KeyA) turn = -0.7;
  if (keys.ArrowRight || keys.KeyD) turn = 0.7;
  if (DEMO) turn = Math.sin(t * 0.28) * 0.55;
  heading -= turn * 1.1 * dt;

  const speed = 42;
  wx += Math.sin(heading) * -speed * dt;
  wz += Math.cos(heading) * -speed * dt;
  dist += speed * dt;

  // biome + HUD
  const segIdx = Math.floor(dist / BIOME_SPAN) % BIOMES.length;
  const bName = BIOMES[segIdx].name;
  if (bName !== lastBiome) { lastBiome = bName; biomeEl.style.opacity = 0; setTimeout(() => { biomeEl.textContent = bName; biomeEl.style.opacity = 1; }, 400); }
  distEl.textContent = Math.floor(dist) + ' km';

  // rebuild terrain around ship (snap origin to CELL grid to avoid vertex swim);
  // ship stays at scene origin, the world scrolls under it
  const ox = Math.round(wx / CELL) * CELL, oz = Math.round(wz / CELL) * CELL;
  terrain.position.set(ox - wx, 0, oz - wz);
  for (let i = 0; i < tPos.count; i++) {
    const gx = tPos.getX(i), gz = tPos.getZ(i);
    tPos.setY(i, heightAt(gx + ox, gz + oz, dist, t));
  }
  tPos.needsUpdate = true;

  // glide: follow the ground smoothly, never crash
  const groundHere = heightAt(wx, wz - 6, dist, t);
  const targetY = groundHere + 9;
  shipY += (targetY - shipY) * Math.min(1, dt * 2.2);

  ship.position.set(0, shipY, 0);
  ship.rotation.y = heading;
  ship.rotation.z = -turn * 0.5;

  const back = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
  camera.position.set(back.x * 16, shipY + 7, back.z * 16);
  camera.lookAt(back.x * -30, shipY + 1, back.z * -30);

  // sun sits on the horizon opposite the start heading, slowly wheeling
  const sa = t * 0.01 + 0.6;
  sunDisk.position.set(Math.sin(sa) * -420, 46 + Math.sin(t * 0.05) * 22, Math.cos(sa) * -420);
  sunDisk.lookAt(camera.position);

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
