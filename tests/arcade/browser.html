<!doctype html>
<title>Arcade browser verification</title>
<style>body { margin: 0; background: black; } iframe { width: 100vw; height: 100vh; border: 0; }</style>
<iframe title="Game under test"></iframe>
<script type="module">
  // Dev-server-only fixture: instrument the actual standalone scripts without shipping debug globals.
  const params = new URLSearchParams(location.search);
  const game = params.get('game') || 'city';
  if (!['asteroids', 'city', 'drift', 'horizon', 'meridian', 'murmur', 'stack', 'tunnel'].includes(game)) throw Error('Unknown game');
  const path = `/arcade/${game}/`;
  const html = await (await fetch(params.has('baseline') ? `/tests/arcade/.baseline/${game}.txt` : path + 'index.html')).text();
  const instrumentation = `
    let seed = 12345;
    window.__random = () => { seed = Math.imul(1664525, seed) + 1013904223 | 0; return (seed >>> 0) / 4294967296; };
  `;
  const frame = document.querySelector('iframe');
  // Expose lexical game state only inside this test document, for repeatable lifecycle/resource checks.
  const expose = `\nwindow.__game = { scene, renderer, camera, input, loop, tick,
    run: expression => eval(expression) };\n`;
  const seededDirection = `
    THREE.Vector3.prototype.randomDirection = function () {
      const z = __random() * 2 - 1, angle = __random() * Math.PI * 2;
      const r = Math.sqrt(1 - z * z);
      return this.set(r * Math.cos(angle), r * Math.sin(angle), z);
    };
  `;
  frame.srcdoc = `<base href="${path}"><script>${instrumentation}<\/script>` +
    html.replaceAll('Math.random()', '__random()')
      .replace(/^startLoop\(tick\);/m, 'const loop = startLoop(tick);')
      .replace(/^createInput\(/m, 'const input = createInput(')
      .replace("import * as THREE from 'three';", "import * as THREE from 'three';" + seededDirection).replace(/(<script type="module">[\s\S]*?)(<\/script>)/, '$1' + expose + (params.has('freeze') ? '\nloop.dispose(); tick(0, 0);\n' : '') + '$2');
  window.gameFrame = frame;
  window.measure = async () => {
    const { renderer, scene, camera, loop } = frame.contentWindow.__game;
    loop.dispose();
    const gl = renderer.getContext(), ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    const cpu = [], gpu = [];
    const next = () => new Promise(resolve => requestAnimationFrame(resolve));
    for (let i = 0; i < 40; i++) {
      const query = ext && gl.createQuery();
      if (query) gl.beginQuery(ext.TIME_ELAPSED_EXT, query);
      const start = performance.now();
      renderer.render(scene, camera);
      cpu.push(performance.now() - start);
      if (query) {
        gl.endQuery(ext.TIME_ELAPSED_EXT);
        await next();
        while (!gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)) await next();
        if (!gl.getParameter(ext.GPU_DISJOINT_EXT)) gpu.push(gl.getQueryParameter(query, gl.QUERY_RESULT) / 1e6);
        gl.deleteQuery(query);
      } else await next();
    }
    const median = values => values.sort((a, b) => a - b)[Math.floor(values.length / 2)];
    return { calls: renderer.info.render.calls, jsMedianMs: median(cpu), gpuMedianMs: median(gpu) };
  };
</script>
